name: Build Android Customer Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-customer-release.yml'

permissions:
  contents: read

concurrency:
  group: android-customer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-customer-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Lock B93 app change scope
        shell: bash
        run: |
          set -euo pipefail
          BASE_COMMIT="9aba76300a75cd88ef5debc54a17bb247edd0db3"
          git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_COMMIT" HEAD -- app | sort)
          EXPECTED=(
            "app/build.gradle.kts"
            "app/src/main/java/com/benedictinteractive/bearagnostic/FileHealthScanner.kt"
          )
          printf 'B93 changed app files:\n%s\n' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          for i in "${!EXPECTED[@]}"; do
            test "${CHANGED[$i]}" = "${EXPECTED[$i]}"
          done

      - name: Verify durable runtime contracts
        run: python3 scripts/verify_runtime_contracts.py

      - name: Verify current B93 release isolation + keeper gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          ent = (root / 'app/src/main/java/com/benedictinteractive/bearagnostic/EntitlementManager.kt').read_text(encoding='utf-8')
          bridge = (root / 'app/src/main/java/com/benedictinteractive/bearagnostic/NativeBridge.kt').read_text(encoding='utf-8')
          pro_ui = (root / 'app/src/main/legacy-adapter/android-pro-ui.js').read_text(encoding='utf-8')
          billing = (root / 'app/src/main/legacy-adapter/android-billing.js').read_text(encoding='utf-8')
          scanner = (root / 'app/src/main/java/com/benedictinteractive/bearagnostic/FileHealthScanner.kt').read_text(encoding='utf-8')

          def between(text, start, end):
              a = text.find(start)
              if a < 0:
                  raise AssertionError(f'missing section start: {start}')
              b = text.find(end, a + len(start))
              if b < 0:
                  b = len(text)
              return text[a:b]

          set_debug = between(ent, 'fun setDebugTier(rawTier: String): String {', 'fun clearDebugTier(): String {')
          clear_debug = between(ent, 'fun clearDebugTier(): String {', 'fun updatePlayOwnership(')
          state_json = between(ent, 'fun stateJsonObject(): JSONObject {', 'companion object {')
          qa_bridge = between(bridge, 'fun runCommerceQaScenario(scenario: String): String {', 'fun setDebugEntitlement(tier: String): String {')

          assert 'if (!BuildConfig.DEBUG)' in set_debug, 'setDebugTier is not release-gated'
          assert 'debug_controls_unavailable' in set_debug, 'setDebugTier release rejection missing'
          assert 'if (!BuildConfig.DEBUG)' in clear_debug, 'clearDebugTier is not release-gated'
          assert 'debug_controls_unavailable' in clear_debug, 'clearDebugTier release rejection missing'
          assert 'put("debugControlsAvailable", BuildConfig.DEBUG)' in state_json, 'release debug visibility flag drifted'
          assert 'if (!BuildConfig.DEBUG) return rejected("qa_unavailable")' in qa_bridge, 'commerce QA bridge is not release-gated'

          assert 'const debug = state.debugControlsAvailable === true;' in pro_ui, 'Pro debug visibility is not tied to native release state'
          assert 'const debugBlock = debug ?' in pro_ui, 'Pro debug block is not conditionally rendered'

          assert 'ent?.debugControlsAvailable === true' in billing, 'billing debug visibility is not tied to entitlement state'
          assert 'if (!available) {' in billing and 'owned?.remove?.();' in billing, 'billing debug fallback is not removed when unavailable'

          assert (root / 'app/src/debug/java/com/benedictinteractive/bearagnostic/CommerceQaActivity.kt').is_file(), 'debug QA source set unexpectedly missing'
          assert (root / 'app/src/debug/java/com/benedictinteractive/bearagnostic/DebugBillingSandbox.kt').is_file(), 'debug sandbox source unexpectedly missing'

          # B93: never recommend a trash/recycle copy as the keeper when the exact
          # duplicate group still contains a verified normal copy.
          for marker in (
              'B93 duplicate keeper policy',
              'private fun isTrashLikeDuplicateMember(file: File): Boolean',
              'name.startsWith(".trashed-")',
              'val preferredPool = members.filterNot(::isTrashLikeDuplicateMember).ifEmpty { members }',
              'val keep = preferredDuplicateKeeper(members)',
              '?: preferredDuplicateCandidate(unselected)',
              '?: preferredDuplicateCandidate(validMembers)',
              'val TRASH_PATH_SEGMENTS = setOf(',
          ):
              assert marker in scanner, f'B93 keeper-policy marker missing: {marker}'

          print('PASS current B93 release isolation source gates')
          print('PASS B93 non-trash duplicate keeper policy source gate')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Release candidate only
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify Release APK and prepare QA artifact
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          OUT="app/build/outputs/apk/customer-release"
          UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          test -n "$UNSIGNED_APK"
          mkdir -p "$OUT"

          ALIGNED="$OUT/SIGN_LATER_Bearagnostic-B93-CUSTOMER-RELEASE-unsigned-aligned.apk"
          QA_SIGNED="$OUT/INSTALL_THIS_Bearagnostic-B93-CUSTOMER-RELEASE-QA.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$ALIGNED"

          APP_ID="$($APKANALYZER manifest application-id "$ALIGNED" | tr -d '\r\n')"
          VERSION_NAME="$($APKANALYZER manifest version-name "$ALIGNED" | tr -d '\r\n')"
          VERSION_CODE="$($APKANALYZER manifest version-code "$ALIGNED" | tr -d '\r\n')"
          DEBUGGABLE="$($APKANALYZER manifest debuggable "$ALIGNED" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"

          test "$APP_ID" = "com.benedictinteractive.bearagnostic"
          test "$VERSION_NAME" = "0.35.45-alpha93"
          test "$VERSION_CODE" = "93"
          test "$DEBUGGABLE" = "false"

          python3 - "$ALIGNED" <<'PY'
          import sys, zipfile

          apk = sys.argv[1]
          forbidden_dex = (
              b'CommerceQaActivity',
              b'Bearagnostic Commerce QA',
              b'Lcom/benedictinteractive/bearagnostic/DebugBillingSandbox;',
              b'Lcom/benedictinteractive/bearagnostic/DebugCommerceQaHarness;',
              b'bearagnostic_debug_billing_sandbox_v2',
          )

          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              dex = b''.join(z.read(n) for n in names if n.startswith('classes') and n.endswith('.dex'))
              for marker in forbidden_dex:
                  if marker in dex:
                      raise SystemExit(f'FAIL release DEX contains debug-only marker: {marker!r}')

              # B93 binary evidence: these conservative trash/recycle signatures must
              # survive Kotlin compilation into the exact Release APK being tested.
              for marker in (b'.trashed-', b'.trash-', b'$recycle.bin', b'.recycle-bin'):
                  if marker not in dex:
                      raise SystemExit(f'FAIL release DEX missing B93 keeper-policy marker: {marker!r}')

              pro_name = 'assets/ui/js/android-pro-ui.js'
              billing_name = 'assets/ui/js/android-billing.js'
              final_polish_name = 'assets/ui/js/android-final-polish.js'
              if pro_name not in names or billing_name not in names or final_polish_name not in names:
                  raise SystemExit('FAIL release APK missing canonical Pro/billing/final-polish assets')

              pro_ui = z.read(pro_name).decode('utf-8', errors='strict')
              billing = z.read(billing_name).decode('utf-8', errors='strict')
              final_polish = z.read(final_polish_name).decode('utf-8', errors='strict')

              for marker in (
                  'B92 settings viewport contract',
                  '#preferencesScreen.is-active:not([hidden])',
                  '#baUnifiedSettingsDetail.is-active:not([hidden])',
                  'grid-template-rows:auto minmax(0,1fr)!important',
                  'scroll-padding-bottom:max(28px,env(safe-area-inset-bottom))!important',
              ):
                  if marker not in final_polish:
                      raise SystemExit(f'FAIL packaged B92 settings viewport marker missing: {marker}')

              if 'const debug = state.debugControlsAvailable === true;' not in pro_ui:
                  raise SystemExit('FAIL packaged Pro UI lost native release debug gate')
              if 'const debugBlock = debug ?' not in pro_ui:
                  raise SystemExit('FAIL packaged Pro UI lost conditional debug block')
              if 'ent?.debugControlsAvailable === true' not in billing:
                  raise SystemExit('FAIL packaged billing UI lost release debug gate')
              if 'owned?.remove?.();' not in billing:
                  raise SystemExit('FAIL packaged billing UI cannot remove debug fallback in Release')

          print('PASS release APK contains no debug-only QA classes')
          print('PASS packaged Pro UI remains gated by release native state')
          print('PASS packaged B92 settings viewport contract is present')
          print('PASS packaged B93 non-trash duplicate keeper policy is present')
          PY

          # Test-sign only so P'Benz can install the exact Release behavior before
          # permanent production signing. This public repository key is NOT the
          # Benedict production trust identity and must never be distributed.
          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/bearagnostic-debug.jks \
            --ks-key-alias bearagnosticdebug \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$QA_SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$QA_SIGNED" > "$OUT/QA-test-signature-report.txt"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$QA_SIGNED"

          QA_APP_ID="$($APKANALYZER manifest application-id "$QA_SIGNED" | tr -d '\r\n')"
          QA_VERSION_NAME="$($APKANALYZER manifest version-name "$QA_SIGNED" | tr -d '\r\n')"
          QA_VERSION_CODE="$($APKANALYZER manifest version-code "$QA_SIGNED" | tr -d '\r\n')"
          QA_DEBUGGABLE="$($APKANALYZER manifest debuggable "$QA_SIGNED" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"

          test "$QA_APP_ID" = "$APP_ID"
          test "$QA_VERSION_NAME" = "$VERSION_NAME"
          test "$QA_VERSION_CODE" = "$VERSION_CODE"
          test "$QA_DEBUGGABLE" = "false"

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          APP_TREE="$(git rev-parse HEAD:app)"

          {
            echo "Bearagnostic B93 Customer Release QA Candidate"
            echo "Source commit: $SOURCE_COMMIT"
            echo "Accepted B93 app tree: $APP_TREE"
            echo "Application ID: $APP_ID"
            echo "Version name: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "Debuggable: $DEBUGGABLE"
            echo "Duplicate keeper policy: prefer verified non-trash copy over trash/recycle copies"
            echo "Customer-visible Dev entitlement controls: gated OFF by Release BuildConfig.DEBUG=false"
            echo "QA APK signing: TEST-ONLY repository key; NOT FOR PUBLIC DISTRIBUTION"
            echo "Install for QA: INSTALL_THIS_Bearagnostic-B93-CUSTOMER-RELEASE-QA.apk"
            echo "Production signing input: SIGN_LATER_Bearagnostic-B93-CUSTOMER-RELEASE-unsigned-aligned.apk"
            echo "Final public APK must be signed locally with the permanent Benedict production key"
          } > "$OUT/READ_ME_FIRST_customer-release-report.txt"

          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          sha256sum "$QA_SIGNED" > "$QA_SIGNED.sha256"

      - name: Upload Customer Release QA candidate
        uses: actions/upload-artifact@v4
        with:
          name: CUSTOMER-RELEASE-B93-QA-${{ github.run_number }}
          path: |
            app/build/outputs/apk/customer-release/INSTALL_THIS_Bearagnostic-B93-CUSTOMER-RELEASE-QA.apk
            app/build/outputs/apk/customer-release/INSTALL_THIS_Bearagnostic-B93-CUSTOMER-RELEASE-QA.apk.sha256
            app/build/outputs/apk/customer-release/SIGN_LATER_Bearagnostic-B93-CUSTOMER-RELEASE-unsigned-aligned.apk
            app/build/outputs/apk/customer-release/SIGN_LATER_Bearagnostic-B93-CUSTOMER-RELEASE-unsigned-aligned.apk.sha256
            app/build/outputs/apk/customer-release/READ_ME_FIRST_customer-release-report.txt
            app/build/outputs/apk/customer-release/QA-test-signature-report.txt
          if-no-files-found: error
          retention-days: 7
