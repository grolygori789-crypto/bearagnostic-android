name: Build Android Customer Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-customer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-customer-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Lock accepted B91 app source
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APP_TREE="7cc691820e13f2f2780ebdd6d0db8bea8908f988"
          ACTUAL_APP_TREE="$(git rev-parse HEAD:app)"
          echo "Expected app tree: $EXPECTED_APP_TREE"
          echo "Actual app tree:   $ACTUAL_APP_TREE"
          test "$ACTUAL_APP_TREE" = "$EXPECTED_APP_TREE"

      - name: Verify runtime contracts
        run: python3 scripts/verify_runtime_contracts.py

      - name: Verify release commerce isolation source gates
        run: python3 scripts/verify_commerce_release_isolation.py

      - name: Verify release debug-isolation source gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ent = Path('app/src/main/java/com/benedictinteractive/bearagnostic/EntitlementManager.kt').read_text(encoding='utf-8')
          bridge = Path('app/src/main/java/com/benedictinteractive/bearagnostic/NativeBridge.kt').read_text(encoding='utf-8')
          pro_ui = Path('app/src/main/legacy-adapter/android-pro-ui.js').read_text(encoding='utf-8')
          billing = Path('app/src/main/legacy-adapter/android-billing.js').read_text(encoding='utf-8')

          def between(text, start, end):
              a = text.find(start)
              if a < 0:
                  raise AssertionError(f'missing section start: {start}')
              b = text.find(end, a + len(start))
              if b < 0:
                  b = len(text)
              return text[a:b]

          set_debug = between(ent, 'fun setDebugTier(rawTier: String): String {', 'fun clearDebugTier(): String {')
          clear_debug = between(ent, 'fun clearDebugTier(): String {', 'fun updatePlayOwnership(')
          state_json = between(ent, 'fun stateJsonObject(): JSONObject {', 'companion object {')
          qa_bridge = between(bridge, 'fun runCommerceQaScenario(scenario: String): String {', 'fun setDebugEntitlement(tier: String): String {')

          assert 'if (!BuildConfig.DEBUG)' in set_debug, 'setDebugTier is not release-gated'
          assert 'debug_controls_unavailable' in set_debug, 'setDebugTier release rejection missing'
          assert 'if (!BuildConfig.DEBUG)' in clear_debug, 'clearDebugTier is not release-gated'
          assert 'debug_controls_unavailable' in clear_debug, 'clearDebugTier release rejection missing'
          assert 'put("debugControlsAvailable", BuildConfig.DEBUG)' in state_json, 'release debug visibility flag drifted'
          assert 'if (!BuildConfig.DEBUG) return rejected("qa_unavailable")' in qa_bridge, 'commerce QA bridge is not release-gated'
          assert 'const debug = state.debugControlsAvailable === true;' in pro_ui, 'Pro debug UI is not tied to native debug flag'
          assert 'ent?.debugControlsAvailable === true' in billing, 'billing debug UI is not tied to native debug flag'

          print('PASS release debug-isolation source gates')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Release candidate
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify Release APK and prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          OUT="app/build/outputs/apk/customer-release"
          UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          test -n "$UNSIGNED_APK"
          mkdir -p "$OUT"

          ALIGNED="$OUT/Bearagnostic-B91-customer-release-unsigned-aligned.apk"
          QA_SIGNED="$OUT/Bearagnostic-B91-customer-release-QA-test-signed.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$ALIGNED"

          APP_ID="$($APKANALYZER manifest application-id "$ALIGNED" | tr -d '\r\n')"
          VERSION_NAME="$($APKANALYZER manifest version-name "$ALIGNED" | tr -d '\r\n')"
          VERSION_CODE="$($APKANALYZER manifest version-code "$ALIGNED" | tr -d '\r\n')"
          DEBUGGABLE="$($APKANALYZER manifest debuggable "$ALIGNED" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"

          test "$APP_ID" = "com.benedictinteractive.bearagnostic"
          test "$VERSION_NAME" = "0.35.43-alpha91"
          test "$VERSION_CODE" = "91"
          test "$DEBUGGABLE" = "false"

          python3 - "$ALIGNED" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          forbidden = (
              b'CommerceQaActivity',
              b'Bearagnostic Commerce QA',
              b'Lcom/benedictinteractive/bearagnostic/DebugBillingSandbox;',
              b'bearagnostic_debug_billing_sandbox_v2',
          )
          with zipfile.ZipFile(apk) as z:
              dex = b''.join(z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex'))
          for marker in forbidden:
              if marker in dex:
                  raise SystemExit(f'FAIL release DEX contains debug marker: {marker!r}')
          print('PASS release DEX contains no debug QA classes')
          PY

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/bearagnostic-debug.jks \
            --ks-key-alias bearagnosticdebug \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$QA_SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$QA_SIGNED" > "$OUT/qa-test-signature-report.txt"
          "$BUILD_TOOLS/zipalign" -c -p 4 "$QA_SIGNED"

          QA_APP_ID="$($APKANALYZER manifest application-id "$QA_SIGNED" | tr -d '\r\n')"
          QA_VERSION_NAME="$($APKANALYZER manifest version-name "$QA_SIGNED" | tr -d '\r\n')"
          QA_VERSION_CODE="$($APKANALYZER manifest version-code "$QA_SIGNED" | tr -d '\r\n')"
          QA_DEBUGGABLE="$($APKANALYZER manifest debuggable "$QA_SIGNED" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')"

          test "$QA_APP_ID" = "$APP_ID"
          test "$QA_VERSION_NAME" = "$VERSION_NAME"
          test "$QA_VERSION_CODE" = "$VERSION_CODE"
          test "$QA_DEBUGGABLE" = "false"

          SOURCE_COMMIT="$(git rev-parse HEAD)"
          APP_TREE="$(git rev-parse HEAD:app)"

          {
            echo "Bearagnostic B91 Customer Release Candidate"
            echo "Source commit: $SOURCE_COMMIT"
            echo "Accepted app tree: $APP_TREE"
            echo "Application ID: $APP_ID"
            echo "Version name: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "Debuggable: $DEBUGGABLE"
            echo "QA APK signing: TEST-ONLY key; NOT FOR PUBLIC DISTRIBUTION"
            echo "Production signing input: Bearagnostic-B91-customer-release-unsigned-aligned.apk"
            echo "Final public APK must be signed locally with the permanent Benedict production key"
          } > "$OUT/customer-release-report.txt"

          sha256sum "$ALIGNED" > "$ALIGNED.sha256"
          sha256sum "$QA_SIGNED" > "$QA_SIGNED.sha256"

      - name: Upload Customer Release candidate
        uses: actions/upload-artifact@v4
        with:
          name: bearagnostic-B91-customer-release-candidate-${{ github.run_number }}
          path: |
            app/build/outputs/apk/customer-release/Bearagnostic-B91-customer-release-unsigned-aligned.apk
            app/build/outputs/apk/customer-release/Bearagnostic-B91-customer-release-unsigned-aligned.apk.sha256
            app/build/outputs/apk/customer-release/Bearagnostic-B91-customer-release-QA-test-signed.apk
            app/build/outputs/apk/customer-release/Bearagnostic-B91-customer-release-QA-test-signed.apk.sha256
            app/build/outputs/apk/customer-release/customer-release-report.txt
            app/build/outputs/apk/customer-release/qa-test-signature-report.txt
          if-no-files-found: error
          retention-days: 7
